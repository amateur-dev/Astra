name: Build macOS DMG

on:
  push:
    branches: [ "dmg-packaging" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-mac:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js 18
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Cache node modules
        uses: actions/cache@v4
        with:
          path: |
            ~/.npm
            node_modules
          key: ${{ runner.os }}-node-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-

      - name: Build whisper.cpp with portable rpaths
        run: |
          # Clone whisper.cpp
          git clone --depth 1 https://github.com/ggerganov/whisper.cpp.git /tmp/whisper.cpp
          cd /tmp/whisper.cpp
          
          # Build with CMake - Metal enabled for macOS
          cmake -B build -DWHISPER_METAL=ON -DBUILD_SHARED_LIBS=OFF -DWHISPER_BUILD_EXAMPLES=ON
          NCPU=$(sysctl -n hw.ncpu 2>/dev/null || echo 4)
          cmake --build build --config Release -j$NCPU
          
          # Copy the whisper-cli binary to the project
          mkdir -p $GITHUB_WORKSPACE/build/whisper
          cp build/bin/whisper-cli $GITHUB_WORKSPACE/build/whisper/
          
          # Verify the binary doesn't have hardcoded user paths
          echo "Checking library dependencies:"
          otool -L $GITHUB_WORKSPACE/build/whisper/whisper-cli

      - name: Install dependencies
        run: npm ci

      - name: Build DMG (electron-builder)
        # Only run distribution build; signing is skipped for PRs automatically
        run: npm run dist

      - name: Upload DMG artifact
        uses: actions/upload-artifact@v4
        with:
          name: voice-hotkey-dmg
          path: dist/*.dmg
