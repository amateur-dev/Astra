name: Build macOS DMG

on:
  push:
    branches: [ main, 'copilot/**', '**/build-macos-menu-bar-app' ]
  workflow_dispatch:

jobs:
  build:
    name: Build and package DMG
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build VoiceHotkeyApp (Release)
        run: |
          set -euo pipefail
          # path to the Xcode project relative to repository root
          PROJECT=VoiceHotkeyApp/VoiceHotkeyApp.xcodeproj
          SCHEME=VoiceHotkeyApp
          BUILD_DIR="$PWD/build"

          echo "Building project..."
          # Disable code signing for a CI unsigned build
          xcodebuild -project "$PROJECT" -scheme "$SCHEME" -configuration Release \
            -derivedDataPath "$BUILD_DIR" \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" build

      - name: Package built .app into a DMG
        run: |
          set -euo pipefail
          BUILD_PRODUCTS="$PWD/build/Build/Products/Release"
          APP_PATH=$(find "$BUILD_PRODUCTS" -maxdepth 2 -name "VoiceHotkeyApp.app" -print | head -n1)
          if [ -z "$APP_PATH" ]; then
            echo "Built app not found in $BUILD_PRODUCTS"
            ls -la "$BUILD_PRODUCTS" || true
            exit 1
          fi

          echo "Found app: $APP_PATH"
          ARTIFACT="$PWD/VoiceHotkeyApp-Release.dmg"
          bash scripts/package-dmg.sh "$APP_PATH" "$ARTIFACT"

      - name: Upload DMG artifact
        uses: actions/upload-artifact@v4
        with:
          name: VoiceHotkeyApp-dmg
          path: VoiceHotkeyApp-Release.dmg

  build-and-smoke-test:
    name: Build, package, and smoke test
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build VoiceHotkeyApp (Release)
        run: |
          set -euo pipefail
          PROJECT=VoiceHotkeyApp/VoiceHotkeyApp.xcodeproj
          SCHEME=VoiceHotkeyApp
          BUILD_DIR="$PWD/build"
          
          echo "Building project..."
          xcodebuild -project "$PROJECT" -scheme "$SCHEME" -configuration Release \
            -derivedDataPath "$BUILD_DIR" \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" build

      - name: Package DMG
        run: |
          set -euo pipefail
          BUILD_PRODUCTS="$PWD/build/Build/Products/Release"
          APP_PATH=$(find "$BUILD_PRODUCTS" -maxdepth 2 -name "VoiceHotkeyApp.app" -print | head -n1)
          if [ -z "$APP_PATH" ]; then
            echo "Built app not found in $BUILD_PRODUCTS"
            ls -la "$BUILD_PRODUCTS" || true
            exit 1
          fi
          
          echo "Found app: $APP_PATH"
          ARTIFACT="$PWD/VoiceHotkeyApp-Release.dmg"
          bash scripts/package-dmg.sh "$APP_PATH" "$ARTIFACT"

      - name: Install app on runner for smoke test
        run: |
          set -euo pipefail
          APP_SRC="$PWD/build/Build/Products/Release/VoiceHotkeyApp.app"
          APP_DST="/Applications/VoiceHotkeyApp.app"
          
          echo "Installing app to $APP_DST"
          sudo rm -rf "$APP_DST" || true
          sudo cp -R "$APP_SRC" "$APP_DST"
          sudo xattr -dr com.apple.quarantine "$APP_DST" || true
          sudo chmod -R a+rX "$APP_DST"
          
          # Verify executable exists and is executable
          BIN="$APP_DST/Contents/MacOS/VoiceHotkeyApp"
          if [ ! -f "$BIN" ]; then
            echo "ERROR: Executable not found at $BIN"
            ls -la "$APP_DST/Contents/MacOS/" || true
            exit 1
          fi
          if [ ! -x "$BIN" ]; then
            echo "ERROR: Executable is not executable"
            ls -l "$BIN"
            exit 1
          fi
          echo "App installed and verified"

      - name: Run smoke test (launch and collect logs)
        run: |
          set -euo pipefail
          BIN="/Applications/VoiceHotkeyApp.app/Contents/MacOS/VoiceHotkeyApp"
          LOG_DIR="$GITHUB_WORKSPACE/smoketest-logs"
          mkdir -p "$LOG_DIR"
          
          echo "Running headless smoke test with 30s timeout..."
          # Run in headless smoke test mode with environment variable but guard with a 30s timeout
          # Start the app in background and capture stdout/stderr
          VOICEHOTKEY_SMOKE_TEST=1 "$BIN" > "$LOG_DIR/app.stdout" 2> "$LOG_DIR/app.stderr" &
          APP_PID=$!

          # Wait up to 30 seconds for the process to finish
          TIMEOUT=60
          ELAPSED=0
          while kill -0 "$APP_PID" 2>/dev/null; do
            if [ "$ELAPSED" -ge "$TIMEOUT" ]; then
              echo "Smoke test timed out after ${TIMEOUT}s, killing process $APP_PID"
              kill "$APP_PID" 2>/dev/null || true
              break
            fi
            sleep 1
            ELAPSED=$((ELAPSED + 1))
          done

          # Collect exit code (0 if finished cleanly)
          if kill -0 "$APP_PID" 2>/dev/null; then
            # still running; attempt to wait and then force kill
            wait "$APP_PID" 2>/dev/null || true
            SMOKE_EXIT_CODE=124
          else
            wait "$APP_PID" 2>/dev/null || true
            SMOKE_EXIT_CODE=$?
          fi
          
          echo "Smoke test exited with code: $SMOKE_EXIT_CODE"
          
          # Collect filtered system logs as additional evidence
          echo "Collecting system logs..."
          log show --predicate 'subsystem == "com.voicehotkey.app" AND (eventMessage CONTAINS "StatusBarController" OR eventMessage CONTAINS "Status bar" OR eventMessage CONTAINS "Smoke test")' \
            --last 5m --info > "$LOG_DIR/syslog.txt" 2>&1 || true
          
          # Create combined log file for review
          echo "=== App stdout ===" > "$LOG_DIR/combined.txt"
          cat "$LOG_DIR/app.stdout" >> "$LOG_DIR/combined.txt" || true
          echo "" >> "$LOG_DIR/combined.txt"
          echo "=== App stderr ===" >> "$LOG_DIR/combined.txt"
          cat "$LOG_DIR/app.stderr" >> "$LOG_DIR/combined.txt" || true
          echo "" >> "$LOG_DIR/combined.txt"
          echo "=== System log ===" >> "$LOG_DIR/combined.txt"
          cat "$LOG_DIR/syslog.txt" >> "$LOG_DIR/combined.txt" || true
          
          # Print stdout for immediate visibility
          echo ""
          echo "=== Smoke Test Output (stdout) ==="
          cat "$LOG_DIR/app.stdout"
          echo ""
          echo "=== Smoke Test Errors (stderr) ==="
          cat "$LOG_DIR/app.stderr" || true
          echo ""
          
          # Check if smoke test passed via exit code
          if [ $SMOKE_EXIT_CODE -eq 0 ]; then
            echo ""
            echo "✅ SMOKE TEST PASSED: App exited with success code"
            
            # Verify expected startup logs are present in stdout
            if grep -E "StatusBarController initializing|StatusBarController initialized|Status bar icon set successfully" "$LOG_DIR/app.stdout" > /dev/null 2>&1; then
              echo "✅ Expected startup log messages found in stdout"
              exit 0
            else
              echo "⚠️  WARNING: App passed but expected log messages not found in stdout"
              echo "This may indicate a logging issue. Check artifacts for details."
              # Still pass since exit code was 0
              exit 0
            fi
          else
            echo ""
            echo "❌ SMOKE TEST FAILED: App exited with code $SMOKE_EXIT_CODE"
            echo "The app may have crashed or failed to initialize properly."
            echo ""
            echo "Expected exit code: 0"
            echo "Actual exit code: $SMOKE_EXIT_CODE"
            echo ""
            echo "Expected to find one of these messages in stdout:"
            echo "  - 'StatusBarController initializing'"
            echo "  - 'StatusBarController initialized'"
            echo "  - 'Status bar icon set successfully'"
            echo ""
            echo "Full logs are available in the uploaded artifacts."
            ls -la "$LOG_DIR"
            exit 1
          fi

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: VoiceHotkeyApp-dmg-and-logs
          path: |
            VoiceHotkeyApp-Release.dmg
            smoketest-logs/**
