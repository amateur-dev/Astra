<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <title>ASTRA</title>
  <link rel="stylesheet" href="./ui/tokens.css" />
</head>
<body>
  <!-- Main View -->
  <div class="main-container">
    <div class="header">
      <div class="brand">
        <div class="logo"><svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2a3 3 0 0 0-3 3v7a3 3 0 0 0 6 0V5a3 3 0 0 0-3-3z"/><path d="M19 10v2a7 7 0 0 1-14 0v-2"/><line x1="12" y1="19" x2="12" y2="22"/></svg></div>
        <h2>ASTRA</h2>
      </div>
      <div class="actions">
        <div id="status" class="status-indicator">Ready</div>
        <button id="settingsBtn" class="icon-btn" title="Settings">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"></circle><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path></svg>
        </button>
      </div>
    </div>

    <div class="content" id="leftCard">
      <div class="mic-container">
        <button id="recordBtn" class="mic-button">
          <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"></path><path d="M19 10v2a7 7 0 0 1-14 0v-2"></path><line x1="12" y1="19" x2="12" y2="23"></line><line x1="8" y1="23" x2="16" y2="23"></line></svg>
        </button>
        <div class="mic-glow"></div>
      </div>
      
      <div class="hint-text">
        <span id="hotkeyLabel">⌘ + Shift + V</span> to Record
      </div>
      
      <div class="controls-hidden">
        <button id="clearBtn" class="btn" disabled>Clear</button>
      </div>
    </div>
  </div>

  <!-- Settings Modal -->
  <div id="settingsModal" class="modal-overlay" style="display:none;">
    <div class="modal">
      <div class="modal-header">
        <h3>Preferences</h3>
        <button id="closeSettingsBtn" class="icon-btn">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
        </button>
      </div>

      <div class="modal-body">
        <div class="setting-group">
          <div class="setting-row">
            <div class="setting-info">
              <label>Standard Hotkey</label>
              <span class="setting-desc">Audio + Selected Text</span>
            </div>
            <div class="setting-action">
              <input id="hotkeyInput" type="text" class="input-mono" placeholder="Cmd+Shift+V" readonly />
              <button id="setHotkeyBtn" class="btn-small">Set</button>
            </div>
          </div>

          <div class="setting-row">
            <div class="setting-info">
              <label>Vision Hotkey</label>
              <span class="setting-desc">Audio + Text + Screen</span>
            </div>
            <div class="setting-action">
              <input id="visionHotkeyInput" type="text" class="input-mono" placeholder="Cmd+Opt+Shift+V" readonly />
              <button id="setVisionHotkeyBtn" class="btn-small">Set</button>
            </div>
          </div>

          <div class="setting-row">
            <div class="setting-info">
              <label for="autoPaste">Auto-paste Transcript</label>
              <span class="setting-desc">Paste directly into active app</span>
            </div>
            <div class="setting-action">
              <label class="switch">
                <input id="autoPaste" type="checkbox" checked />
                <span class="slider"></span>
              </label>
            </div>
          </div>
          
          <div class="setting-row" id="polishSection">
            <div class="setting-info">
              <label for="ollamaEnabled">Polish with AI (Ollama)</label>
              <span class="setting-desc">Improves grammar locally</span>
            </div>
            <div class="setting-action">
              <label class="switch">
                <input id="ollamaEnabled" type="checkbox" />
                <span class="slider"></span>
              </label>
            </div>
          </div>
          
          <div class="setting-row">
            <div class="setting-info">
              <label for="enableAiCaveat">Append AI Caveat</label>
              <span class="setting-desc">Adds disclaimer to output</span>
            </div>
            <div class="setting-action">
              <label class="switch">
                <input id="enableAiCaveat" type="checkbox" />
                <span class="slider"></span>
              </label>
            </div>
          </div>
        </div>

        <div class="setting-group">
          <h4>Models & Permissions</h4>
          
          <div class="setting-row">
            <div class="setting-info">
              <label>Whisper Model</label>
            </div>
          </div>
          <div id="modelListContainer" class="model-list">
             <div class="loading-text">Loading models...</div>
          </div>

          <div class="setting-row">
            <div class="setting-info">
              <label>Microphone Access</label>
              <span id="micStatus" class="status-badge">unknown</span>
            </div>
            <div class="setting-action">
              <button id="openMicSettingsBtn" class="btn-small">Open Settings</button>
            </div>
          </div>
        </div>
      </div>

      <div class="modal-footer">
        <div class="footer-links">
          <a href="#" id="viewLogsBtn">Logs</a>
          <span class="dot">•</span>
          <a href="#" id="githubLink">GitHub</a>
          <span class="dot">•</span>
          <span class="version-text" id="appVersion">v2.1.0</span>
        </div>
        <button id="closeSettingsBtnBottom" class="btn-primary">Done</button>
      </div>

      <!-- Hidden inputs for renderer compat -->
      <div style="display:none;">
        <input id="whisperBin" type="text" />
        <input id="ffmpegPath" type="text" />
        <input id="modelPath" type="text" />
        <input id="suggestedCmd" type="text" />
        <input id="autoTranscribe" type="checkbox" checked />
        <input id="polishWhileTranscribe" type="checkbox" />
        <input id="ollamaUrl" type="text" />
        <input id="ollamaModel" type="text" />
        <button id="saveSettingsBtn"></button>
        <button id="testSettingsBtn"></button>
        <button id="recheckWhisperBtn"></button>
        <button id="useSuggestedBtn"></button>
        <button id="copySuggestedBtn"></button>
        <button id="downloadTinyBtn"></button>
        <button id="downloadSmallBtn"></button>
        <button id="downloadBaseBtn"></button>
        <div id="downloadStatus"></div>
        <div id="downloadProgress"><div id="downloadProgressBar"></div></div>
        <div id="settingsResult"></div>
        <div id="depStatus"></div>
        <a href="#" id="authorLink"></a>
      </div>
    </div>
  </div>

  <script>
    (function(){
      const settingsBtn = document.getElementById('settingsBtn');
      const settingsModal = document.getElementById('settingsModal');
      const closeSettingsBtn = document.getElementById('closeSettingsBtn');
      const closeSettingsBtnBottom = document.getElementById('closeSettingsBtnBottom');
      const viewLogsBtn = document.getElementById('viewLogsBtn');
      const githubLink = document.getElementById('githubLink');
      const appVersion = document.getElementById('appVersion');
      const depStatus = document.getElementById('depStatus');
      
      function openSettings(){ 
        settingsModal.style.display='flex';
        checkDependencies();
        checkOllama();
      }
      function closeSettings(){ settingsModal.style.display='none'; }
      
      function checkDependencies() {
        if (window.electronAPI && window.electronAPI.checkDependencies) {
          window.electronAPI.checkDependencies().then(status => {
            depStatus.innerHTML = status;
          });
        }
      }
      function checkOllama() {
        const polishSection = document.getElementById('polishSection');
        if (window.electronAPI && window.electronAPI.checkOllama) {
          window.electronAPI.checkOllama().then(result => {
            if (!result.running) {
              polishSection.style.opacity = '0.5';
              const ollamaCheckbox = document.getElementById('ollamaEnabled');
              if (ollamaCheckbox) ollamaCheckbox.checked = false;
            } else {
              polishSection.style.opacity = '1';
            }
          }).catch(err => {
            polishSection.style.opacity = '0.5';
          });
        }
      }
      
      if(settingsBtn) settingsBtn.addEventListener('click', openSettings);
      if(closeSettingsBtn) closeSettingsBtn.addEventListener('click', closeSettings);
      if(closeSettingsBtnBottom) closeSettingsBtnBottom.addEventListener('click', closeSettings);
      
      if(viewLogsBtn) {
        viewLogsBtn.addEventListener('click', () => {
          if (window.electronAPI && window.electronAPI.openLogViewer) {
            window.electronAPI.openLogViewer();
          }
        });
      }
      if(githubLink) {
        githubLink.addEventListener('click', (e) => {
          e.preventDefault();
          if (window.electronAPI && window.electronAPI.openExternal) {
            window.electronAPI.openExternal('https://github.com/amateur-dev/local-hotkey-voice-mac-app');
          }
        });
      }
      if(window.electronAPI && window.electronAPI.getAppVersion) {
        window.electronAPI.getAppVersion().then(version => {
          appVersion.textContent = 'v' + version;
        });
      }
      document.addEventListener('keydown', (e)=>{ if(e.key==='Escape') closeSettings(); });
    })();
  </script>
  <script src="renderer.js"></script>
</body>
</html>
