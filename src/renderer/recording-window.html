<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Recording...</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      background: rgba(255, 255, 255, 0.95);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      overflow: hidden;
      user-select: none;
      -webkit-user-select: none;
      -webkit-app-region: drag;
      width: 320px;
      height: 160px;
    }
    
    .container {
      padding: 12px 16px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
      height: 100%;
    }
    
    /* Recording State */
    .recording-mode {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
      width: 100%;
    }
    
    .header {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    
    .logo {
      width: 24px;
      height: 24px;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      border-radius: 6px;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
    }
    
    .logo::before {
      content: '';
      width: 0;
      height: 0;
      border-left: 8px solid transparent;
      border-right: 8px solid transparent;
      border-bottom: 13px solid white;
      transform: rotate(180deg);
    }
    
    .recording-indicator {
      width: 8px;
      height: 8px;
      background: #ff3b30;
      border-radius: 50%;
      position: absolute;
      top: -1px;
      right: -1px;
      animation: pulse 1.5s ease-in-out infinite;
    }
    
    @keyframes pulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.6; transform: scale(1.1); }
    }
    
    .timer {
      font-size: 20px;
      font-weight: 600;
      color: #1d1d1f;
      font-variant-numeric: tabular-nums;
      letter-spacing: 0.5px;
    }
    
    .waveform-container {
      width: 100%;
      height: 60px;
      background: #f5f5f7;
      border-radius: 8px;
      padding: 6px;
      position: relative;
      overflow: hidden;
    }
    
    #waveform {
      width: 100%;
      height: 100%;
      display: block;
    }
    
    .shortcuts {
      display: flex;
      gap: 12px;
      font-size: 11px;
      color: #86868b;
    }
    
    .shortcut {
      display: flex;
      align-items: center;
      gap: 6px;
    }
    
    .key {
      background: #fff;
      border: 1px solid #d2d2d7;
      border-radius: 4px;
      padding: 2px 6px;
      font-size: 11px;
      font-weight: 500;
      color: #1d1d1f;
      box-shadow: 0 1px 2px rgba(0,0,0,0.05);
    }
    
    /* Processing State */
    .processing-mode {
      display: none;
      flex-direction: column;
      align-items: center;
      gap: 12px;
      width: 100%;
      padding: 20px 0;
    }
    
    .spinner {
      width: 40px;
      height: 40px;
      position: relative;
    }

    .copilot-badge {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
      font-size: 10px;
      font-weight: 700;
      padding: 2px 8px;
      border-radius: 6px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-left: 8px;
      box-shadow: 0 2px 4px rgba(102, 126, 234, 0.3);
    }
    
    .spinner-circle {
      width: 100%;
      height: 100%;
      border-radius: 50%;
      border: 4px solid rgba(102, 126, 234, 0.15);
      border-top-color: #667eea;
      animation: spin 1s linear infinite;
    }
    
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    
    .status-text {
      font-size: 14px;
      font-weight: 500;
      color: #1d1d1f;
    }
    
    .sub-status {
      font-size: 11px;
      color: #86868b;
    }
    
    .audio-level-bar {
      height: 100%;
      background: linear-gradient(90deg, #34c759 0%, #30d158 100%);
      border-radius: 2px;
      transition: width 0.1s ease-out;
      width: 0%;
    }
  </style>
</head>
<body>
  <div class="container">
    <!-- Recording Mode -->
    <div class="recording-mode" id="recordingMode">
      <div class="header">
        <div class="logo">
          <div class="recording-indicator"></div>
        </div>
        <div class="timer" id="timer">00:00</div>
        <div class="copilot-badge" id="copilotBadge" style="display:none">AI Copilot</div>
      </div>
      
      <div class="waveform-container">
        <canvas id="waveform"></canvas>
      </div>
      
      <div id="liveTranscript" style="font-size: 13px; color: #667eea; margin-top: 4px; text-align: center; width: 100%; min-height: 1.2em; font-style: italic; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;"></div>

      <div class="shortcuts">
        <div class="shortcut">
          <span class="key">⌘</span><span class="key">⇧</span><span class="key">V</span>
          <span>Stop</span>
        </div>
        <div class="shortcut">
          <span class="key">Esc</span>
          <span>Cancel</span>
        </div>
      </div>
    </div>
    
    <!-- Processing Mode -->
    <div class="processing-mode" id="processingMode">
      <div class="spinner">
        <div class="spinner-circle"></div>
      </div>
      <div class="status-text" id="statusText">Transcribing</div>
      <div class="sub-status" id="subStatus">Please wait...</div>
    </div>
  </div>
    
    <div class="status" id="status">Recording...</div>
    
    <div class="shortcuts">
      <div class="shortcut">
        <span class="key">⌘</span>
        <span class="key">⇧</span>
        <span class="key">V</span>
        <span>Stop</span>
      </div>
      <div class="shortcut">
        <span class="key">Esc</span>
        <span>Cancel</span>
      </div>
    </div>
  </div>
  
  <script>
    const canvas = document.getElementById('waveform');
    const ctx = canvas.getContext('2d');
    const timerEl = document.getElementById('timer');
    const statusEl = document.getElementById('status');
    const audioLevelBar = document.getElementById('audioLevelBar');
    const copilotBadge = document.getElementById('copilotBadge');
    
    let startTime = null;
    let timerInterval = null;
    let animationId = null;
    let audioContext = null;
    let analyser = null;
    let dataArray = null;
    let activeStream = null;
    let isStarting = false;
    let mediaRecorder = null;
    let audioChunks = [];
    let lastInferenceTime = 0;
    let isProcessingStreaming = false;
    
    // Set canvas resolution
    function resizeCanvas() {
      const dpr = window.devicePixelRatio || 1;
      const rect = canvas.getBoundingClientRect();
      canvas.width = rect.width * dpr;
      canvas.height = rect.height * dpr;
      ctx.scale(dpr, dpr);
    }
    
    resizeCanvas();
    window.addEventListener('resize', resizeCanvas);
    
    // Initialize audio visualization
    async function initAudioVisualization(stream) {
      try {
        audioContext = new (window.AudioContext || window.webkitAudioContext)();
        analyser = audioContext.createAnalyser();
        analyser.fftSize = 2048;
        analyser.smoothingTimeConstant = 0.8;
        
        const source = audioContext.createMediaStreamSource(stream);
        source.connect(analyser);
        
        const bufferLength = analyser.frequencyBinCount;
        dataArray = new Uint8Array(bufferLength);
        
        drawWaveform();
      } catch (e) {
        console.error('Failed to initialize audio visualization:', e);
      }
    }
    
    // Draw waveform visualization
    function drawWaveform() {
      if (!analyser || !dataArray) return;
      
      animationId = requestAnimationFrame(drawWaveform);
      
      analyser.getByteTimeDomainData(dataArray);
      
      const width = canvas.getBoundingClientRect().width;
      const height = canvas.getBoundingClientRect().height;
      
      // Clear canvas
      ctx.fillStyle = '#f5f5f7';
      ctx.fillRect(0, 0, width, height);
      
      // Draw waveform
      ctx.lineWidth = 2;
      ctx.strokeStyle = '#667eea';
      ctx.beginPath();
      
      const sliceWidth = width / dataArray.length;
      let x = 0;
      
      // Calculate audio level for level meter
      let sum = 0;
      for (let i = 0; i < dataArray.length; i++) {
        const v = dataArray[i] / 128.0;
        const y = (v * height) / 2;
        
        sum += Math.abs(v - 1.0);
        
        if (i === 0) {
          ctx.moveTo(x, y);
        } else {
          ctx.lineTo(x, y);
        }
        
        x += sliceWidth;
      }
      
      ctx.lineTo(width, height / 2);
      ctx.stroke();
      
      // Update audio level meter
      const avgLevel = sum / dataArray.length;
      const levelPercent = Math.min(100, avgLevel * 200);
      audioLevelBar.style.width = levelPercent + '%';
    }
    
    // Update timer
    function updateTimer() {
      if (!startTime) return;
      
      const elapsed = Math.floor((Date.now() - startTime) / 1000);
      const minutes = Math.floor(elapsed / 60);
      const seconds = elapsed % 60;
      
      timerEl.textContent = 
        String(minutes).padStart(2, '0') + ':' + 
        String(seconds).padStart(2, '0');
    }
    
    // Start recording UI
    async function startRecording(data) {
      // Prevent concurrent start calls
      if (isStarting) return;
      isStarting = true;

      try {
        const isCopilot = data && data.isCopilot;
        if (copilotBadge) {
          copilotBadge.style.display = isCopilot ? 'block' : 'none';
        }

        const liveTranscript = document.getElementById('liveTranscript');
        if (liveTranscript) liveTranscript.textContent = '';

        // Ensure any previous stream is stopped before starting a new one
        if (activeStream) {
          activeStream.getTracks().forEach(track => {
            try { track.stop(); } catch (e) { console.error('Error stopping previous track:', e); }
          });
          activeStream = null;
        }

        // Show recording mode
        document.getElementById('recordingMode').style.display = 'flex';
        document.getElementById('processingMode').style.display = 'none';
        
        startTime = Date.now();
        timerInterval = setInterval(updateTimer, 1000);
        
        // Get audio stream for waveform visualization
        activeStream = await navigator.mediaDevices.getUserMedia({ 
          audio: { 
            sampleRate: 48000, 
            channelCount: 1, 
            noiseSuppression: false, 
            echoCancellation: false, 
            autoGainControl: false 
          } 
        });
        initAudioVisualization(activeStream);

        // Setup real-time streaming
        audioChunks = [];
        lastInferenceTime = Date.now();
        mediaRecorder = new MediaRecorder(activeStream, { mimeType: 'audio/webm' });
        mediaRecorder.ondataavailable = async (event) => {
          if (event.data.size > 0) {
            audioChunks.push(event.data);
            const now = Date.now();
            // Try inference every 2.5 seconds
            if (now - lastInferenceTime > 2500 && !isProcessingStreaming) {
              lastInferenceTime = now;
              await sendForStreamingInference();
            }
          }
        };
        mediaRecorder.start(500); // Request data every 500ms
      } catch (e) {
        console.error('Failed to get audio stream for visualization:', e);
        // Continue without waveform if mic access fails
      } finally {
        isStarting = false;
      }
    }

    async function sendForStreamingInference() {
      if (!audioChunks.length || isProcessingStreaming) return;
      
      try {
        isProcessingStreaming = true;
        const blob = new Blob(audioChunks, { type: 'audio/webm' });
        const arrayBuffer = await blob.arrayBuffer();
        const uint8 = new Uint8Array(arrayBuffer);
        
        if (window.electronAPI && window.electronAPI.getStreamingTranscript) {
          const result = await window.electronAPI.getStreamingTranscript(uint8);
          if (result && result.ok && result.text) {
            const liveTranscript = document.getElementById('liveTranscript');
            if (liveTranscript) {
              liveTranscript.textContent = result.text.trim();
            }
          }
        }
      } catch (e) {
        console.error('Streaming inference error:', e);
      } finally {
        isProcessingStreaming = false;
      }
    }
    
    // Switch to processing mode
    function showProcessing() {
      document.getElementById('recordingMode').style.display = 'none';
      document.getElementById('processingMode').style.display = 'flex';
      
      // Stop recording UI elements
      stopRecording();
    }
    
    // Stop recording UI
    function stopRecording() {
      if (timerInterval) {
        clearInterval(timerInterval);
        timerInterval = null;
      }
      
      if (animationId) {
        cancelAnimationFrame(animationId);
        animationId = null;
      }
      
      if (audioContext) {
        audioContext.close();
        audioContext = null;
      }

      if (mediaRecorder && mediaRecorder.state !== 'inactive') {
        mediaRecorder.stop();
      }

      // Stop all media tracks to release microphone (removes orange dot)
      if (activeStream) {
        activeStream.getTracks().forEach(track => {
          try { track.stop(); } catch (e) { console.error('Error stopping track:', e); }
        });
        activeStream = null;
      }
    }
    
    // Listen for IPC messages from main process
    if (window.electronAPI) {
      if (window.electronAPI.onRecordingStart) {
        window.electronAPI.onRecordingStart((data) => {
          startRecording(data);
        });
      }
      
      if (window.electronAPI.onRecordingStop) {
        window.electronAPI.onRecordingStop(() => {
          stopRecording();
        });
      }
      
      if (window.electronAPI.onShowProcessing) {
        window.electronAPI.onShowProcessing(() => {
          showProcessing();
        });
      }
    }
    
    // Handle Escape key
    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape') {
        if (window.electronAPI && window.electronAPI.cancelRecording) {
          window.electronAPI.cancelRecording();
        }
      }
    });
    
    // Start immediately if recording is already in progress
    if (window.electronAPI && window.electronAPI.isRecording) {
      window.electronAPI.isRecording().then(recording => {
        if (recording) {
          startRecording(null);
        }
      });
    }
  </script>
</body>
</html>
