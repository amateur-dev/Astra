<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Recording...</title>
  <style>
    :root {
      --accent-cyan: oklch(75% 0.15 220);
      --accent-purple: oklch(65% 0.25 300);
      --fg-primary: oklch(98% 0.005 250);
      --fg-dim: oklch(50% 0.01 250);
      --border-light: rgba(255, 255, 255, 0.12);
      --border-dim: rgba(255, 255, 255, 0.04);
      --font-body: -apple-system, BlinkMacSystemFont, 'SF Pro Text', system-ui, sans-serif;
      --font-mono: 'JetBrains Mono', ui-monospace, SFMono-Regular, monospace;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    
    body {
      font-family: var(--font-body);
      background: transparent;
      color: var(--fg-primary);
      overflow: hidden;
      user-select: none;
      -webkit-user-select: none;
      -webkit-app-region: drag;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      -webkit-font-smoothing: antialiased;
    }
    
    /* The "Island" */
    .island {
      padding: 12px 16px 12px 12px;
      border-radius: 24px;
      display: flex;
      align-items: center;
      gap: 16px;
      width: 100%;
      height: 100%;
      border: 1px solid var(--border-light);
      position: relative;
      overflow: hidden;
      /* Background is handled by macOS Vibrancy, but we add a subtle tint */
      background: rgba(20, 20, 24, 0.2);
    }

    /* Animated Border Glow around Island */
    .island::after {
      content: '';
      position: absolute;
      inset: 0;
      border-radius: 24px;
      padding: 1px;
      background: linear-gradient(90deg, transparent, var(--accent-cyan), transparent);
      -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
      -webkit-mask-composite: xor;
      mask-composite: exclude;
      opacity: 0.5;
      animation: scan 3s linear infinite;
      pointer-events: none;
    }
    @keyframes scan {
      0% { background-position: -400px 0; }
      100% { background-position: 400px 0; }
    }

    /* The "Alive" AI Orb */
    .ai-orb-wrapper {
      position: relative;
      width: 32px;
      height: 32px;
      flex-shrink: 0;
    }
    .ai-orb {
      position: absolute;
      inset: 2px;
      border-radius: 50%;
      background: conic-gradient(from 0deg, var(--accent-cyan), var(--accent-purple), var(--accent-cyan));
      animation: spin 3s linear infinite;
      filter: blur(3px);
      opacity: 0.8;
    }
    .ai-orb-core {
      position: absolute;
      inset: 6px;
      background: #fff;
      border-radius: 50%;
      box-shadow: 0 0 10px #fff;
    }
    @keyframes spin { 100% { transform: rotate(360deg); } }

    .island-content {
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: center;
      overflow: hidden;
    }
    .island-top-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 2px;
    }
    .island-label {
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--accent-cyan);
    }
    .island-model {
      font-family: var(--font-mono);
      font-size: 10px;
      color: var(--fg-dim);
      background: var(--border-dim);
      padding: 2px 6px;
      border-radius: 4px;
    }
    
    .island-transcription {
      font-size: 15px;
      font-weight: 400;
      color: var(--fg-primary);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      display: flex;
      align-items: center;
    }
    
    /* Typing cursor effect */
    .typing-cursor {
      display: inline-block;
      width: 2px; height: 15px;
      background: var(--accent-cyan);
      vertical-align: middle;
      margin-left: 2px;
      animation: blink 1s step-end infinite;
    }
    @keyframes blink { 50% { opacity: 0; } }

    /* Processing State (replaces AI Orb) */
    .spinner {
      width: 32px;
      height: 32px;
      position: relative;
      flex-shrink: 0;
      display: none;
    }
    .spinner-circle {
      width: 100%;
      height: 100%;
      border-radius: 50%;
      border: 3px solid rgba(117, 239, 255, 0.15);
      border-top-color: var(--accent-cyan);
      animation: spin-fast 1s linear infinite;
    }
    @keyframes spin-fast {
      to { transform: rotate(360deg); }
    }
    
    #copilotBadge {
      display: none;
      font-size: 9px;
      background: linear-gradient(135deg, var(--accent-cyan), var(--accent-purple));
      color: #fff;
      padding: 1px 4px;
      border-radius: 3px;
      margin-left: 6px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
  </style>
</head>
<body>
  <div class="island" id="island">
    
    <!-- Recording Mode Orb -->
    <div class="ai-orb-wrapper" id="orbWrapper">
      <div class="ai-orb"></div>
      <div class="ai-orb-core"></div>
    </div>
    
    <!-- Processing Mode Spinner -->
    <div class="spinner" id="spinner">
      <div class="spinner-circle"></div>
    </div>
    
    <div class="island-content">
      <div class="island-top-row">
        <div style="display: flex; align-items: center;">
          <span class="island-label" id="statusLabel">Listening</span>
          <span id="copilotBadge">Vision</span>
        </div>
        <span class="island-model" id="timer">00:00</span>
      </div>
      <div class="island-transcription">
        <span id="liveTranscript">Speak now...</span><span class="typing-cursor" id="cursor"></span>
      </div>
    </div>
  </div>

  <script>
    const timerEl = document.getElementById('timer');
    const statusLabel = document.getElementById('statusLabel');
    const liveTranscript = document.getElementById('liveTranscript');
    const orbWrapper = document.getElementById('orbWrapper');
    const spinner = document.getElementById('spinner');
    const copilotBadge = document.getElementById('copilotBadge');
    const cursor = document.getElementById('cursor');
    const island = document.getElementById('island');
    
    let startTime = null;
    let timerInterval = null;
    let activeStream = null;
    let isStarting = false;
    let mediaRecorder = null;
    let audioChunks = [];
    let lastInferenceTime = 0;
    let isProcessingStreaming = false;
    
    // Update timer
    function updateTimer() {
      if (!startTime) return;
      
      const elapsed = Math.floor((Date.now() - startTime) / 1000);
      const minutes = Math.floor(elapsed / 60);
      const seconds = elapsed % 60;
      
      timerEl.textContent = 
        String(minutes).padStart(2, '0') + ':' + 
        String(seconds).padStart(2, '0');
    }
    
    // Start recording UI
    async function startRecording(data) {
      if (isStarting) return;
      isStarting = true;

      try {
        const isCopilot = data && data.isCopilot;
        copilotBadge.style.display = isCopilot ? 'inline-block' : 'none';

        liveTranscript.textContent = 'Speak now...';
        liveTranscript.style.fontStyle = 'italic';
        liveTranscript.style.color = 'var(--fg-dim)';
        
        statusLabel.textContent = 'Listening';
        statusLabel.style.color = 'var(--accent-cyan)';
        
        orbWrapper.style.display = 'block';
        spinner.style.display = 'none';
        cursor.style.display = 'inline-block';
        
        // Reset border animation
        island.style.setProperty('--accent-cyan', 'oklch(75% 0.15 220)');

        // Ensure any previous stream is stopped before starting a new one
        if (activeStream) {
          activeStream.getTracks().forEach(track => {
            try { track.stop(); } catch (e) {}
          });
          activeStream = null;
        }

        startTime = Date.now();
        timerInterval = setInterval(updateTimer, 1000);
        
        // Get audio stream just to keep mic active and grab chunks for streaming
        activeStream = await navigator.mediaDevices.getUserMedia({ 
          audio: { 
            sampleRate: 48000, 
            channelCount: 1, 
            noiseSuppression: false, 
            echoCancellation: false, 
            autoGainControl: false 
          } 
        });

        // Setup real-time streaming
        audioChunks = [];
        lastInferenceTime = Date.now();
        mediaRecorder = new MediaRecorder(activeStream, { mimeType: 'audio/webm' });
        mediaRecorder.ondataavailable = async (event) => {
          if (event.data.size > 0) {
            audioChunks.push(event.data);
            const now = Date.now();
            // Try inference every 2.5 seconds
            if (now - lastInferenceTime > 2500 && !isProcessingStreaming) {
              lastInferenceTime = now;
              await sendForStreamingInference();
            }
          }
        };
        mediaRecorder.start(500); // Request data every 500ms
      } catch (e) {
        console.error('Failed to get audio stream:', e);
      } finally {
        isStarting = false;
      }
    }

    async function sendForStreamingInference() {
      if (!audioChunks.length || isProcessingStreaming) return;
      
      try {
        isProcessingStreaming = true;
        const blob = new Blob(audioChunks, { type: 'audio/webm' });
        const arrayBuffer = await blob.arrayBuffer();
        const uint8 = new Uint8Array(arrayBuffer);
        
        if (window.electronAPI && window.electronAPI.getStreamingTranscript) {
          const result = await window.electronAPI.getStreamingTranscript(uint8);
          if (result && result.ok && result.text) {
            if (liveTranscript) {
              liveTranscript.textContent = `"${result.text.trim()}`;
              liveTranscript.style.fontStyle = 'normal';
              liveTranscript.style.color = 'var(--fg-primary)';
            }
          }
        }
      } catch (e) {
        console.error('Streaming inference error:', e);
      } finally {
        isProcessingStreaming = false;
      }
    }
    
    // Switch to processing mode
    function showProcessing() {
      // Stop recording UI elements
      stopRecording();
      
      orbWrapper.style.display = 'none';
      spinner.style.display = 'block';
      cursor.style.display = 'none';
      
      statusLabel.textContent = 'Transcribing';
      statusLabel.style.color = 'var(--accent-purple)';
      
      if (liveTranscript.textContent === 'Speak now...') {
        liveTranscript.textContent = 'Processing audio...';
      }
      
      // Change border scan color
      island.style.setProperty('--accent-cyan', 'var(--accent-purple)');
    }
    
    // Stop recording UI
    function stopRecording() {
      if (timerInterval) {
        clearInterval(timerInterval);
        timerInterval = null;
      }
      
      if (mediaRecorder && mediaRecorder.state !== 'inactive') {
        mediaRecorder.stop();
      }

      if (activeStream) {
        activeStream.getTracks().forEach(track => {
          try { track.stop(); } catch (e) {}
        });
        activeStream = null;
      }
    }
    
    // Listen for IPC messages from main process
    if (window.electronAPI) {
      if (window.electronAPI.onRecordingStart) {
        window.electronAPI.onRecordingStart((data) => {
          startRecording(data);
        });
      }
      
      if (window.electronAPI.onRecordingStop) {
        window.electronAPI.onRecordingStop(() => {
          stopRecording();
        });
      }
      
      if (window.electronAPI.onShowProcessing) {
        window.electronAPI.onShowProcessing(() => {
          showProcessing();
        });
      }
    }
    
    // Handle Escape key
    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape') {
        if (window.electronAPI && window.electronAPI.cancelRecording) {
          window.electronAPI.cancelRecording();
        }
      }
    });
    
    // Start immediately if recording is already in progress
    if (window.electronAPI && window.electronAPI.isRecording) {
      window.electronAPI.isRecording().then(recording => {
        if (recording) {
          startRecording(null);
        }
      });
    }
  </script>
</body>
</html>
